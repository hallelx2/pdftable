name: Test

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches: [main]` filter here means the
  # matrix only runs on PRs whose BASE is main, so every PR in a stacked
  # chain (base = another feature branch) silently gets no CI at all —
  # and the newest, least-reviewed PR is the one left unchecked.
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -count=1 ./...
