<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="The three namespaces between a byte in a PDF and a character on screen">
  <rect width="1100" height="520" fill="#FCFCFD"/>

  <text x="48" y="52" font-family="Geist Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#71717A">THREE NAMESPACES, NOT ONE</text>
  <text x="48" y="90" font-family="Geist, Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0A0A0A">A byte in a PDF is not a character</text>

  <!-- chain -->
  <g transform="translate(48,140)">
    <!-- node 1 -->
    <rect x="0" y="0" width="230" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="20" y="28" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.4" fill="#71717A">1 · CHARACTER CODE</text>
    <text x="20" y="66" font-family="Geist Mono, monospace" font-size="26" fill="#0A0A0A">0x61</text>
    <text x="20" y="86" font-family="Geist, sans-serif" font-size="12" fill="#71717A">one byte in the stream</text>

    <line x1="230" y1="48" x2="288" y2="48" stroke="#71717A" stroke-width="1.5"/>
    <path d="M288 48 L280 43 L280 53 Z" fill="#71717A"/>
    <text x="238" y="38" font-family="Geist Mono, monospace" font-size="10" fill="#1456f0">/Encoding</text>

    <!-- node 2 -->
    <rect x="296" y="0" width="230" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="316" y="28" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.4" fill="#71717A">2 · GLYPH NAME</text>
    <text x="316" y="66" font-family="Geist Mono, monospace" font-size="26" fill="#0A0A0A">"alpha"</text>
    <text x="316" y="86" font-family="Geist, sans-serif" font-size="12" fill="#71717A">an Adobe glyph name</text>

    <line x1="526" y1="48" x2="584" y2="48" stroke="#71717A" stroke-width="1.5"/>
    <path d="M584 48 L576 43 L576 53 Z" fill="#71717A"/>
    <text x="530" y="38" font-family="Geist Mono, monospace" font-size="10" fill="#1456f0">Adobe Glyph List</text>

    <!-- node 3 -->
    <rect x="592" y="0" width="230" height="96" rx="10" fill="#ffffff" stroke="#1456f0"/>
    <text x="612" y="28" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.4" fill="#1456f0">3 · UNICODE</text>
    <text x="612" y="68" font-family="Geist, sans-serif" font-size="30" fill="#0A0A0A">α</text>
    <text x="650" y="68" font-family="Geist Mono, monospace" font-size="16" fill="#71717A">U+03B1</text>
    <text x="612" y="86" font-family="Geist, sans-serif" font-size="12" fill="#71717A">what a human or an LLM reads</text>
  </g>

  <!-- the failure -->
  <g transform="translate(48,300)">
    <rect x="0" y="0" width="1004" height="130" rx="10" fill="#fff" stroke="#ea5ec1"/>
    <text x="24" y="32" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#ea5ec1">THE FAILURE — SYMBOL FONT WITH NO /ENCODING DECLARED</text>

    <text x="24" y="70" font-family="Geist, sans-serif" font-size="15" fill="#3F3F46">Symbol carries its own built-in encoding. Apply the default instead and step 2 returns the wrong name:</text>

    <g font-family="Geist Mono, monospace" font-size="15">
      <text x="24"  y="106" fill="#71717A">0x61</text>
      <text x="76"  y="106" fill="#71717A">→</text>
      <text x="100" y="106" fill="#ea5ec1">"a"</text>
      <text x="146" y="106" fill="#71717A">→</text>
      <text x="170" y="106" fill="#ea5ec1">a</text>
      <text x="200" y="106" fill="#71717A">instead of</text>
      <text x="300" y="106" fill="#1456f0">"alpha"</text>
      <text x="380" y="106" fill="#71717A">→</text>
      <text x="404" y="106" fill="#1456f0">α</text>
      <text x="440" y="106" fill="#3F3F46">— a paper of Greek comes back as nonsense Latin</text>
    </g>
  </g>

  <text x="48" y="480" font-family="Geist, Inter, system-ui, sans-serif" font-size="15" fill="#3F3F46">Width lookup runs <tspan font-family="Geist Mono, monospace" font-size="14">code → Unicode → width</tspan>, so a broken step 2 corrupts the geometry as well as the text. One fault, both chains.</text>
</svg>
