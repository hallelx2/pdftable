<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-label="ICDAR 2013 results and the ceiling reachable with correct table boundaries">
  <rect width="1100" height="620" fill="#FCFCFD"/>

  <text x="48" y="52" font-family="Geist Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#71717A">ICDAR 2013 TABLE COMPETITION · 125 PDFS · ADJACENCY-RELATION F1</text>
  <text x="48" y="90" font-family="Geist, Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0A0A0A">Where the points actually are</text>

  <!-- chart -->
  <g transform="translate(300,130)">
    <!-- axis -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#E5E7EB"/>
    <g font-family="Geist Mono, monospace" font-size="11" fill="#71717A">
      <line x1="0" y1="300" x2="700" y2="300" stroke="#E5E7EB"/>
      <line x1="175" y1="0" x2="175" y2="300" stroke="#E5E7EB" stroke-dasharray="3 4"/>
      <line x1="350" y1="0" x2="350" y2="300" stroke="#E5E7EB" stroke-dasharray="3 4"/>
      <line x1="525" y1="0" x2="525" y2="300" stroke="#E5E7EB" stroke-dasharray="3 4"/>
      <line x1="700" y1="0" x2="700" y2="300" stroke="#E5E7EB" stroke-dasharray="3 4"/>
      <text x="0" y="320" text-anchor="middle">0</text>
      <text x="175" y="320" text-anchor="middle">0.25</text>
      <text x="350" y="320" text-anchor="middle">0.50</text>
      <text x="525" y="320" text-anchor="middle">0.75</text>
      <text x="700" y="320" text-anchor="middle">1.00</text>
    </g>

    <!-- bars: value*700 -->
    <!-- pdfplumber lines 0.370 -->
    <rect x="0" y="16" width="259" height="34" rx="4" fill="#71717A" opacity="0.35"/>
    <text x="271" y="39" font-family="Geist Mono, monospace" font-size="14" fill="#3F3F46">0.370</text>

    <!-- pdftable lines 0.362 -->
    <rect x="0" y="66" width="253" height="34" rx="4" fill="#1456f0" opacity="0.55"/>
    <text x="265" y="89" font-family="Geist Mono, monospace" font-size="14" fill="#3F3F46">0.362</text>

    <!-- pdftable auto 0.358 -->
    <rect x="0" y="116" width="251" height="34" rx="4" fill="#1456f0" opacity="0.3"/>
    <text x="263" y="139" font-family="Geist Mono, monospace" font-size="14" fill="#3F3F46">0.358</text>

    <!-- text strategy 0.267 -->
    <rect x="0" y="166" width="187" height="34" rx="4" fill="#ea5ec1" opacity="0.35"/>
    <text x="199" y="189" font-family="Geist Mono, monospace" font-size="14" fill="#3F3F46">0.267</text>

    <!-- ceiling 0.935 -->
    <rect x="0" y="230" width="655" height="42" rx="4" fill="#1456f0"/>
    <text x="667" y="258" font-family="Geist Mono, monospace" font-size="17" fill="#1456f0" font-weight="600">0.935</text>
  </g>

  <!-- labels -->
  <g font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#3F3F46" text-anchor="end">
    <text x="278" y="169">pdfplumber · lines</text>
    <text x="278" y="219">pdftable · lines</text>
    <text x="278" y="269">pdftable · auto</text>
    <text x="278" y="319">pdfplumber · text</text>
  </g>
  <text x="278" y="384" font-family="Geist, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="end">pdftable + perfect grid</text>
  <text x="278" y="404" font-family="Geist Mono, monospace" font-size="11" fill="#71717A" text-anchor="end">ORACLE BOUNDARIES</text>

  <!-- the read -->
  <g transform="translate(48,478)">
    <rect x="0" y="0" width="1004" height="112" rx="10" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="24" y="34" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#71717A">WHAT THE GAP MEANS</text>
    <text x="24" y="68" font-family="Geist, sans-serif" font-size="16" fill="#3F3F46">
      Hand pdftable a correct grid and it scores <tspan font-family="Geist Mono, monospace" fill="#1456f0" font-weight="600">0.935</tspan>. Left to find the grid itself, <tspan font-family="Geist Mono, monospace" fill="#ea5ec1" font-weight="600">0.362</tspan>.
    </text>
    <text x="24" y="94" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="19" fill="#3F3F46">Reading cells was never the problem. Finding rows and columns is.</text>
  </g>
</svg>
