<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Reading a PDF like a printer — building pdftable">
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1456f0"/>
      <stop offset="100%" stop-color="#ea5ec1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(20,86,240,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FCFCFD"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- mark -->
  <g transform="translate(88,74)">
    <rect width="44" height="44" rx="11" fill="#1456f0"/>
    <g transform="translate(6,6) scale(1.0)">
      <line x1="3.6" y1="4.1" x2="16" y2="24.6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="28.4" y1="4.1" x2="16" y2="24.6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="7.7" y1="3.2" x2="16" y2="19.8" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="24.3" y1="3.2" x2="16" y2="19.8" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <circle cx="16" cy="25.6" r="2.7" fill="#ea5ec1"/>
    </g>
  </g>
  <text x="148" y="104" font-family="Geist, Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="-0.4">pdftable</text>

  <text x="88" y="176" font-family="Geist Mono, ui-monospace, monospace" font-size="13" letter-spacing="2.1" fill="#71717A">ENGINEERING NOTES · 7 PARTS</text>

  <!-- headline: gradient on exactly one line -->
  <text x="88" y="256" font-family="Geist, Inter, system-ui, sans-serif" font-size="60" font-weight="600" fill="#0A0A0A" letter-spacing="-1.8">A PDF is not a document.</text>
  <text x="88" y="326" font-family="Geist, Inter, system-ui, sans-serif" font-size="60" font-weight="600" fill="url(#signal)" letter-spacing="-1.8">It is a set of printer instructions.</text>

  <text x="88" y="392" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="30" fill="#3F3F46">So to read one, you have to think like a printer.</text>

  <!-- the journey, as measured -->
  <line x1="88" y1="452" x2="1112" y2="452" stroke="#E5E7EB" stroke-width="1"/>

  <g font-family="Geist Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.4" fill="#71717A">
    <text x="88" y="486">WORD DRIFT</text>
    <text x="343" y="486">NEGATIVE SIGNS KEPT</text>
    <text x="640" y="486">FONTS COVERED</text>
    <text x="895" y="486">TABLE F1 CEILING</text>
  </g>
  <g font-family="Geist, Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#0A0A0A" letter-spacing="-0.8">
    <text x="88" y="530">11.99pt <tspan fill="#71717A" font-weight="400">→</tspan> <tspan fill="#1456f0">0.0000pt</tspan></text>
    <text x="343" y="530">81% <tspan fill="#71717A" font-weight="400">→</tspan> <tspan fill="#1456f0">100%</tspan></text>
    <text x="640" y="530">1 <tspan fill="#71717A" font-weight="400">→</tspan> <tspan fill="#1456f0">12</tspan></text>
    <text x="895" y="530">0.362 <tspan fill="#71717A" font-weight="400">→</tspan> <tspan fill="#1456f0">0.935</tspan></text>
  </g>

  <text x="88" y="580" font-family="Geist, Inter, system-ui, sans-serif" font-size="15" fill="#71717A">A Go library for reading PDFs, built while building the Vectorless engine — and the bugs that never crashed anything.</text>
</svg>
