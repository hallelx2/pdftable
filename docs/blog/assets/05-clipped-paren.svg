<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="A glyph centre 0.008 points past the table edge flips the sign of a financial value">
  <rect width="1100" height="600" fill="#FCFCFD"/>

  <text x="48" y="52" font-family="Geist Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#71717A">3M 2018 FORM 10-K · PAGE 58 · BALANCE SHEET</text>
  <text x="48" y="90" font-family="Geist, Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0A0A0A">0.008 points decided whether a number was positive</text>

  <!-- zoomed glyph strip -->
  <g transform="translate(48,140)">
    <text x="0" y="0" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#71717A">GLYPH POSITIONS, ZOOMED ~30×</text>

    <rect x="0" y="18" width="1004" height="150" rx="10" fill="#ffffff" stroke="#E5E7EB"/>

    <!-- baseline -->
    <line x1="40" y1="128" x2="960" y2="128" stroke="#E5E7EB"/>

    <!-- glyphs of (16,048) -->
    <g font-family="Geist Mono, monospace" font-size="34" fill="#0A0A0A">
      <text x="60"  y="118">(</text>
      <text x="160" y="118">1</text>
      <text x="260" y="118">6</text>
      <text x="360" y="118">,</text>
      <text x="440" y="118">0</text>
      <text x="540" y="118">4</text>
      <text x="640" y="118">8</text>
      <text x="768" y="118" fill="#ea5ec1">)</text>
    </g>

    <!-- the last glyph's box + centre -->
    <rect x="756" y="72" width="76" height="60" fill="#ea5ec1" opacity="0.10" stroke="#ea5ec1" stroke-dasharray="3 3"/>
    <line x1="794" y1="60" x2="794" y2="150" stroke="#ea5ec1" stroke-width="2"/>
    <circle cx="794" cy="102" r="4" fill="#ea5ec1"/>
    <text x="806" y="60" font-family="Geist Mono, monospace" font-size="12" fill="#ea5ec1">glyph centre  537.879</text>

    <!-- the column edge -->
    <line x1="782" y1="34" x2="782" y2="150" stroke="#1456f0" stroke-width="2"/>
    <text x="560" y="52" font-family="Geist Mono, monospace" font-size="12" fill="#1456f0" text-anchor="end">column edge  537.871</text>
    <line x1="566" y1="46" x2="778" y2="46" stroke="#1456f0" stroke-width="1"/>
    <path d="M782 46 L774 41 L774 51 Z" fill="#1456f0"/>
  </g>

  <!-- the gap callout -->
  <g transform="translate(48,326)">
    <rect x="0" y="0" width="490" height="120" rx="10" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="24" y="34" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#71717A">THE MARGIN</text>
    <text x="24" y="76" font-family="Geist, sans-serif" font-size="34" font-weight="600" fill="#ea5ec1" letter-spacing="-0.8">0.008 pt</text>
    <text x="24" y="102" font-family="Geist, sans-serif" font-size="14" fill="#3F3F46">about one nine-thousandth of an inch</text>
  </g>

  <g transform="translate(562,326)">
    <rect x="0" y="0" width="490" height="120" rx="10" fill="#0A0A0A"/>
    <text x="24" y="34" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#71717A">THE CONSEQUENCE</text>
    <g font-family="Geist Mono, monospace" font-size="19">
      <text x="24"  y="76" fill="#8ab4ff">(16,048)</text>
      <text x="150" y="76" fill="#71717A">becomes</text>
      <text x="270" y="76" fill="#ea5ec1">16,048</text>
    </g>
    <text x="24" y="102" font-family="Geist, sans-serif" font-size="14" fill="#e6e6e6">−16,048 read back as +16,048</text>
  </g>

  <!-- scale -->
  <g transform="translate(48,478)">
    <text x="0" y="0" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#71717A">ACROSS FIVE FINANCIAL STATEMENTS</text>
    <line x1="0" y1="14" x2="1004" y2="14" stroke="#E5E7EB"/>
    <text x="0" y="52" font-family="Geist, sans-serif" font-size="17" fill="#3F3F46">
      <tspan font-size="30" font-weight="600" fill="#ea5ec1">20 of 103</tspan><tspan dx="14">negative numbers lost their sign — 19% — while every magnitude stayed correct.</tspan>
    </text>
    <text x="0" y="86" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="19" fill="#3F3F46">A missing value is detectable. A flipped sign is believed.</text>
  </g>
</svg>
