<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Two ways to find a table: drawn rulings versus word alignment">
  <rect width="1100" height="560" fill="#FCFCFD"/>

  <text x="48" y="52" font-family="Geist Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#71717A">A TABLE IS NOT STORED — IT IS INFERRED</text>
  <text x="48" y="90" font-family="Geist, Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0A0A0A">Two strategies, two failure modes</text>

  <!-- LINES -->
  <g transform="translate(48,124)">
    <text x="0" y="0" font-family="Geist Mono, monospace" font-size="12" letter-spacing="1.6" fill="#1456f0">LINES — CELLS FROM RULING INTERSECTIONS</text>
    <rect x="0" y="18" width="470" height="210" rx="10" fill="#ffffff" stroke="#E5E7EB"/>
    <g transform="translate(34,44)">
      <!-- grid -->
      <g stroke="#1456f0" stroke-width="1.5">
        <line x1="0" y1="0" x2="400" y2="0"/>
        <line x1="0" y1="52" x2="400" y2="52"/>
        <line x1="0" y1="104" x2="400" y2="104"/>
        <line x1="0" y1="156" x2="400" y2="156"/>
        <line x1="0" y1="0" x2="0" y2="156"/>
        <line x1="200" y1="0" x2="200" y2="156"/>
        <line x1="300" y1="0" x2="300" y2="156"/>
        <line x1="400" y1="0" x2="400" y2="156"/>
      </g>
      <!-- intersections -->
      <g fill="#ea5ec1">
        <circle cx="0" cy="0" r="3.5"/><circle cx="200" cy="0" r="3.5"/><circle cx="300" cy="0" r="3.5"/><circle cx="400" cy="0" r="3.5"/>
        <circle cx="0" cy="52" r="3.5"/><circle cx="200" cy="52" r="3.5"/><circle cx="300" cy="52" r="3.5"/><circle cx="400" cy="52" r="3.5"/>
        <circle cx="0" cy="104" r="3.5"/><circle cx="200" cy="104" r="3.5"/><circle cx="300" cy="104" r="3.5"/><circle cx="400" cy="104" r="3.5"/>
        <circle cx="0" cy="156" r="3.5"/><circle cx="200" cy="156" r="3.5"/><circle cx="300" cy="156" r="3.5"/><circle cx="400" cy="156" r="3.5"/>
      </g>
      <g font-family="Geist, sans-serif" font-size="13" fill="#3F3F46">
        <text x="12" y="33">Total assets</text><text x="215" y="33">36,500</text><text x="315" y="33">37,987</text>
        <text x="12" y="85">Goodwill</text><text x="215" y="85">10,051</text><text x="315" y="85">10,513</text>
        <text x="12" y="137">Other assets</text><text x="215" y="137">1,345</text><text x="315" y="137">1,395</text>
      </g>
    </g>
    <text x="0" y="252" font-family="Geist, sans-serif" font-size="14" fill="#3F3F46">Works when rulings <tspan font-weight="500" fill="#0A0A0A">cross</tspan>. Precise when it fires.</text>
    <text x="0" y="276" font-family="Geist, sans-serif" font-size="14" fill="#ea5ec1">Blind to tables with no vertical rules.</text>
  </g>

  <!-- TEXT -->
  <g transform="translate(582,124)">
    <text x="0" y="0" font-family="Geist Mono, monospace" font-size="12" letter-spacing="1.6" fill="#1456f0">TEXT — COLUMNS FROM WORD ALIGNMENT</text>
    <rect x="0" y="18" width="470" height="210" rx="10" fill="#ffffff" stroke="#E5E7EB"/>
    <g transform="translate(34,44)">
      <!-- only horizontal rules -->
      <g stroke="#1456f0" stroke-width="1.5">
        <line x1="0" y1="0" x2="400" y2="0"/>
        <line x1="0" y1="52" x2="400" y2="52"/>
        <line x1="0" y1="156" x2="400" y2="156"/>
      </g>
      <!-- inferred columns -->
      <g stroke="#ea5ec1" stroke-width="1.5" stroke-dasharray="5 4">
        <line x1="200" y1="-8" x2="200" y2="164"/>
        <line x1="300" y1="-8" x2="300" y2="164"/>
      </g>
      <g font-family="Geist, sans-serif" font-size="13" fill="#3F3F46">
        <text x="12" y="33">Total assets</text><text x="215" y="33">36,500</text><text x="315" y="33">37,987</text>
        <text x="12" y="85">Goodwill</text><text x="215" y="85">10,051</text><text x="315" y="85">10,513</text>
        <text x="12" y="137">Other assets</text><text x="215" y="137">1,345</text><text x="315" y="137">1,395</text>
      </g>
    </g>
    <text x="0" y="252" font-family="Geist, sans-serif" font-size="14" fill="#3F3F46">Sees borderless and half-ruled tables.</text>
    <text x="0" y="276" font-family="Geist, sans-serif" font-size="14" fill="#ea5ec1">Prose also aligns — it invents tables on body text.</text>
  </g>

  <!-- measured outcome -->
  <g transform="translate(48,428)">
    <rect x="0" y="0" width="1004" height="96" rx="10" fill="#0A0A0A"/>
    <text x="24" y="30" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.6" fill="#71717A">MEASURED ON ICDAR 2013 · 125 PDFS</text>
    <g font-family="Geist Mono, monospace" font-size="15">
      <text x="24"  y="64" fill="#e6e6e6">lines</text>
      <text x="140" y="64" fill="#8ab4ff">precision 0.865</text>
      <text x="320" y="64" fill="#ea5ec1">recall 0.229</text>
      <text x="470" y="64" fill="#e6e6e6">what it finds is right; it finds a quarter</text>
    </g>
    <g font-family="Geist Mono, monospace" font-size="15">
      <text x="24"  y="86" fill="#e6e6e6">text</text>
      <text x="140" y="86" fill="#ea5ec1">precision 0.167</text>
      <text x="320" y="86" fill="#8ab4ff">recall 0.679</text>
      <text x="470" y="86" fill="#e6e6e6">finds most of it; most of what it finds is wrong</text>
    </g>
  </g>
</svg>
